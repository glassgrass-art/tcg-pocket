<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG Pocket 卡牌交换匹配器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 保持卡牌 2:3 标准比例 */
    .card-aspect {
      aspect-ratio: 2.5 / 3.5;
    }
    /* 卡牌悬停 3D 微抬效果 */
    .card-hover-effect {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover-effect:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 24px -6px rgba(250, 204, 21, 0.25);
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <!-- 头部 -->
    <header class="mb-6 text-center">
      <h1 class="text-3xl font-bold tracking-wide text-yellow-400">Pokémon TCG Pocket Trade Matcher</h1>
      <p class="text-slate-400 mt-1">高清大图画风对比 | 点击卡片查看原图 | 锁定稀有度对等交换</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- 左侧：高清卡牌网格展示 -->
      <div class="lg:col-span-2">
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="搜索卡牌名称 / 编号 (例如 Pikachu 或 A1-001)..." 
            class="flex-1 px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-yellow-400 text-sm shadow-inner"
          />
        </div>

        <!-- 调整为响应式网格：自适应大图展示 -->
        <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 gap-5"></div>
      </div>

      <!-- 右侧：交换愿望单 -->
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 h-fit sticky top-6 space-y-6 shadow-xl">
        <!-- 我 wanted 的 (Want) -->
        <div>
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-base font-bold text-yellow-400 flex items-center gap-1.5">
              <span>🟡 我想要的</span>
              <span class="text-xs font-normal text-slate-400">(Want)</span>
            </h2>
            <span id="rarityBadge"></span>
          </div>
          <div id="wantList" class="space-y-2.5 min-h-[90px] bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
            <p class="text-slate-500 text-xs text-center py-6">第一步：点击左侧卡牌 "+ 想要"</p>
          </div>
        </div>

        <!-- 我拥有的 (Have) -->
        <div>
          <h2 class="text-base font-bold text-green-400 mb-3 flex items-center gap-1.5">
            <span>🟢 我有的</span>
            <span class="text-xs font-normal text-slate-400">(Have/Dupe)</span>
          </h2>
          <div id="haveList" class="space-y-2.5 min-h-[90px] bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
            <p class="text-slate-500 text-xs text-center py-6">第二步：选择同稀有度的重复卡</p>
          </div>
        </div>

        <!-- 导出一键贴 -->
        <button 
          onclick="exportTradePost()" 
          class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold rounded-xl shadow-lg transition duration-200 active:scale-95"
        >
          复制交换帖 (带图片和卡号验证)
        </button>
      </div>
    </div>
  </div>

  <!-- 全屏大图 Preview Modal -->
  <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeModal()">
    <div class="relative max-w-md w-full flex flex-col items-center">
      <img id="modalImg" src="" class="w-full h-auto rounded-xl shadow-2xl border-2 border-yellow-400/50" />
      <p id="modalCaption" class="mt-3 text-sm font-semibold text-yellow-400 bg-slate-900/80 px-4 py-1.5 rounded-full border border-slate-700"></p>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const cardsGrid = document.getElementById('cardsGrid');
    const haveList = document.getElementById('haveList');
    const wantList = document.getElementById('wantList');
    const rarityBadge = document.getElementById('rarityBadge');
    const imageModal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const modalCaption = document.getElementById('modalCaption');

    let haveCards = [];
    let wantCards = [];
    let lockedRarity = null;

    async function fetchCards() {
      const search = searchInput.value.trim();
      let url = '/api/cards?';
      if (search) url += `search=${encodeURIComponent(search)}`;

      const res = await fetch(url);
      const result = await res.json();
      renderCards(result.data || []);
    }

    function renderCards(cards) {
      cardsGrid.innerHTML = cards.map(card => {
        const isMismatched = lockedRarity && card.rarity !== lockedRarity;

        return `
          <div class="bg-slate-800 rounded-2xl p-3 border border-slate-700/80 flex flex-col justify-between card-hover-effect relative group ${isMismatched ? 'opacity-30' : ''}">
            
            <!-- 卡牌核心展示区 (大图) -->
            <div class="relative w-full card-aspect rounded-xl overflow-hidden bg-slate-950 border border-slate-700/50 cursor-zoom-in" onclick="openModal('${card.image}', '${card.name} [#${card.id}]')">
              <img 
                src="${card.image}" 
                alt="${card.name}" 
                class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                onerror="this.onerror=null; this.src='https://via.placeholder.com/300x420/1e293b/94a3b8?text=No+Image';"
              />
              
              <!-- 顶部浮动 Tag：编号与稀有度 -->
              <div class="absolute top-2 left-2 right-2 flex justify-between items-center pointer-events-none">
                <span class="text-[10px] font-mono px-2 py-0.5 rounded-md bg-slate-950/80 text-slate-200 border border-slate-700/60 backdrop-blur-md">
                  ${card.id}
                </span>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-yellow-500/90 text-slate-950 backdrop-blur-md">
                  ${card.rarity || '标准'}
                </span>
              </div>
            </div>

            <!-- 卡牌名称 -->
            <div class="mt-2 mb-3 text-center">
              <h3 class="font-bold text-white text-sm truncate" title="${card.name}">${card.name}</h3>
              <p class="text-[11px] text-slate-400 truncate">${card.pack || '基础包'}</p>
            </div>

            <!-- 操作按钮 -->
            <div class="grid grid-cols-2 gap-1.5 pt-2 border-t border-slate-700/50">
              <button 
                onclick='addWantCard(${JSON.stringify(card).replace(/'/g, "&apos;")})'
                ${isMismatched ? 'disabled' : ''}
                class="py-1.5 bg-yellow-500/20 hover:bg-yellow-500 text-yellow-400 hover:text-slate-950 border border-yellow-500/30 rounded-lg font-bold text-xs transition disabled:cursor-not-allowed disabled:opacity-50"
              >
                + 想要
              </button>
              <button 
                onclick='addHaveCard(${JSON.stringify(card).replace(/'/g, "&apos;")})'
                ${!lockedRarity || isMismatched ? 'disabled' : ''}
                class="py-1.5 bg-green-500/20 hover:bg-green-500 text-green-400 hover:text-slate-950 border border-green-500/30 rounded-lg font-bold text-xs transition disabled:cursor-not-allowed disabled:opacity-30"
              >
                + 我有
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(imgUrl, caption) {
      modalImg.src = imgUrl;
      modalCaption.innerText = caption;
      imageModal.classList.remove('hidden');
    }

    function closeModal() {
      imageModal.classList.add('hidden');
    }

    function addWantCard(card) {
      if (!lockedRarity) {
        lockedRarity = card.rarity;
      } else if (card.rarity !== lockedRarity) {
        alert(`Pocket 交易规则：必须同稀有度！当前已锁定 [${lockedRarity}]`);
        return;
      }

      if (!wantCards.some(c => c.id === card.id)) {
        wantCards.push(card);
        updateTradeUI();
        fetchCards();
      }
    }

    function addHaveCard(card) {
      if (card.rarity !== lockedRarity) {
        alert(`请选择同为 [${lockedRarity}] 稀有度的卡牌！`);
        return;
      }

      if (!haveCards.some(c => c.id === card.id)) {
        haveCards.push(card);
        updateTradeUI();
      }
    }

    function removeItem(type, id) {
      if (type === 'want') {
        wantCards = wantCards.filter(c => c.id !== id);
      } else {
        haveCards = haveCards.filter(c => c.id !== id);
      }

      if (wantCards.length === 0 && haveCards.length === 0) {
        lockedRarity = null;
      }

      updateTradeUI();
      fetchCards();
    }

    function updateTradeUI() {
      rarityBadge.innerHTML = lockedRarity 
        ? `<span class="text-[11px] font-semibold bg-yellow-500/20 text-yellow-400 px-2 py-0.5 rounded-full border border-yellow-500/30">已锁定: ${lockedRarity}</span>`
        : '';

      // 愿望单右侧：放大图片比例并提高画质
      wantList.innerHTML = wantCards.length ? wantCards.map(c => `
        <div class="flex justify-between items-center bg-slate-800 p-2 rounded-xl border border-slate-700/70 shadow-sm">
          <div class="flex items-center gap-3">
            <img src="${c.image}" class="w-12 h-16 object-cover rounded-lg bg-slate-950 border border-slate-700 cursor-pointer" onclick="openModal('${c.image}', '${c.name} [#${c.id}]')" />
            <div>
              <p class="text-xs font-bold text-white">${c.name}</p>
              <p class="text-[11px] font-mono text-yellow-400 mt-0.5">#${c.id}</p>
            </div>
          </div>
          <button onclick="removeItem('want', '${c.id}')" class="text-slate-400 hover:text-red-400 text-sm px-2 transition">✕</button>
        </div>
      `).join('') : '<p class="text-slate-500 text-xs text-center py-6">第一步：点击左侧卡牌 "+ 想要"</p>';

      haveList.innerHTML = haveCards.length ? haveCards.map(c => `
        <div class="flex justify-between items-center bg-slate-800 p-2 rounded-xl border border-slate-700/70 shadow-sm">
          <div class="flex items-center gap-3">
            <img src="${c.image}" class="w-12 h-16 object-cover rounded-lg bg-slate-950 border border-slate-700 cursor-pointer" onclick="openModal('${c.image}', '${c.name} [#${c.id}]')" />
            <div>
              <p class="text-xs font-bold text-white">${c.name}</p>
              <p class="text-[11px] font-mono text-green-400 mt-0.5">#${c.id}</p>
            </div>
          </div>
          <button onclick="removeItem('have', '${c.id}')" class="text-slate-400 hover:text-red-400 text-sm px-2 transition">✕</button>
        </div>
      `).join('') : '<p class="text-slate-500 text-xs text-center py-6">第二步：选择同稀有度的重复卡</p>';
    }

    function exportTradePost() {
      if (!haveCards.length && !wantCards.length) return alert('请先添加卡牌！');
      
      let text = `[Pokémon TCG Pocket Trade Request]\n\n`;
      text += `🟡 WANT:\n` + (wantCards.map(c => `- ${c.name} [#${c.id}] (${c.rarity})`).join('\n') || '- None') + `\n\n`;
      text += `🟢 HAVE:\n` + (haveCards.map(c => `- ${c.name} [#${c.id}] (${c.rarity})`).join('\n') || '- None') + `\n\n`;
      text += `DM me if interested!`;

      navigator.clipboard.writeText(text);
      alert('已复制交换帖！带精确编号，防止同名不同画风发错卡。');
    }

    searchInput.addEventListener('input', fetchCards);
    fetchCards();
  </script>
</body>
</html>

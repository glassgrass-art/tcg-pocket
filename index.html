<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG Pocket 全图鉴交换匹配器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card-aspect { aspect-ratio: 2.5 / 3.5; }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateY(-4px); }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <header class="mb-6 text-center">
      <h1 class="text-3xl font-bold text-yellow-400">Pokémon TCG Pocket Trade Matcher</h1>
      <p class="text-slate-400 mt-1 text-sm">已支持多扩展包全图鉴 | 懒加载极速渲染 | 同稀有度匹配</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- 左侧：卡牌检索 -->
      <div class="lg:col-span-2">
        <div class="mb-6">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="搜索卡牌名称或卡号 (例如: Pikachu 或 A1-096)..." 
            class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-yellow-400 text-sm shadow-inner"
          />
        </div>

        <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        <div id="loading" class="text-center py-8 text-slate-500 text-sm">加载中...</div>
      </div>

      <!-- 右侧：交换愿望单 -->
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 h-fit sticky top-6 space-y-6">
        <div>
          <div class="flex justify-between items-center mb-2">
            <h2 class="text-base font-bold text-yellow-400">🟡 我想要的 (Want)</h2>
            <span id="rarityBadge"></span>
          </div>
          <div id="wantList" class="space-y-2 min-h-[80px] bg-slate-900/60 p-2 rounded-xl border border-slate-700/60"></div>
        </div>

        <div>
          <h2 class="text-base font-bold text-green-400 mb-2">🟢 我有的 (Have)</h2>
          <div id="haveList" class="space-y-2 min-h-[80px] bg-slate-900/60 p-2 rounded-xl border border-slate-700/60"></div>
        </div>

        <button onclick="exportTradePost()" class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold rounded-xl shadow-lg transition">
          复制交换帖 (Format for Reddit/Discord)
        </button>
      </div>
    </div>
  </div>

  <!-- 大图 Preview Modal -->
  <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeModal()">
    <div class="relative max-w-sm w-full flex flex-col items-center">
      <img id="modalImg" src="" class="w-full h-auto rounded-xl shadow-2xl border-2 border-yellow-400/50" />
      <p id="modalCaption" class="mt-3 text-sm font-semibold text-yellow-400 bg-slate-900 px-4 py-1.5 rounded-full border border-slate-700"></p>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const cardsGrid = document.getElementById('cardsGrid');
    const loading = document.getElementById('loading');
    const wantList = document.getElementById('wantList');
    const haveList = document.getElementById('haveList');
    const rarityBadge = document.getElementById('rarityBadge');

    let haveCards = [], wantCards = [], lockedRarity = null;
    let timer = null;

    async function fetchCards() {
      loading.style.display = 'block';
      const search = searchInput.value.trim();
      const res = await fetch(`/api/cards?search=${encodeURIComponent(search)}&limit=60`);
      const result = await res.json();
      loading.style.display = 'none';
      renderCards(result.data || []);
    }

    function renderCards(cards) {
      if (!cards.length) {
        cardsGrid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">未找到相关卡牌</p>`;
        return;
      }

      cardsGrid.innerHTML = cards.map(card => {
        const isMismatched = lockedRarity && card.rarity !== lockedRarity;

        return `
          <div class="bg-slate-800 rounded-xl p-2.5 border border-slate-700/80 flex flex-col justify-between card-hover relative ${isMismatched ? 'opacity-30' : ''}">
            <div class="relative w-full card-aspect rounded-lg overflow-hidden bg-slate-950 cursor-pointer" onclick="openModal('${card.highImage}', '${card.name} [#${card.id}]')">
              <img 
                src="${card.image}" 
                loading="lazy" 
                alt="${card.name}" 
                class="w-full h-full object-cover"
                onerror="this.src='https://via.placeholder.com/200x280?text=No+Image';"
              />
              <span class="absolute top-1 left-1 text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-950/80 text-slate-200 border border-slate-700/60">
                ${card.id}
              </span>
            </div>

            <div class="mt-2 mb-2 text-center">
              <h3 class="font-bold text-white text-xs truncate" title="${card.name}">${card.name}</h3>
              <p class="text-[10px] text-yellow-400 font-medium truncate">${card.rarity}</p>
            </div>

            <div class="grid grid-cols-2 gap-1 border-t border-slate-700/50 pt-1.5">
              <button 
                onclick='addWantCard(${JSON.stringify(card).replace(/'/g, "&apos;")})'
                ${isMismatched ? 'disabled' : ''}
                class="py-1 bg-yellow-500/20 hover:bg-yellow-500 text-yellow-400 hover:text-slate-950 rounded font-bold text-[11px] transition disabled:opacity-40"
              >
                + 想要
              </button>
              <button 
                onclick='addHaveCard(${JSON.stringify(card).replace(/'/g, "&apos;")})'
                ${!lockedRarity || isMismatched ? 'disabled' : ''}
                class="py-1 bg-green-500/20 hover:bg-green-500 text-green-400 hover:text-slate-950 rounded font-bold text-[11px] transition disabled:opacity-30"
              >
                + 我有
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(img, caption) {
      document.getElementById('modalImg').src = img;
      document.getElementById('modalCaption').innerText = caption;
      document.getElementById('imageModal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('imageModal').classList.add('hidden'); }

    function addWantCard(card) {
      if (!lockedRarity) lockedRarity = card.rarity;
      else if (card.rarity !== lockedRarity) return alert(`Pocket 规则：必须交换相同稀有度的卡！锁定为 [${lockedRarity}]`);

      if (!wantCards.some(c => c.id === card.id)) {
        wantCards.push(card);
        updateTradeUI();
        fetchCards();
      }
    }

    function addHaveCard(card) {
      if (card.rarity !== lockedRarity) return alert(`请选择 [${lockedRarity}] 稀有度的卡牌！`);
      if (!haveCards.some(c => c.id === card.id)) {
        haveCards.push(card);
        updateTradeUI();
      }
    }

    function removeItem(type, id) {
      if (type === 'want') wantCards = wantCards.filter(c => c.id !== id);
      else haveCards = haveCards.filter(c => c.id !== id);

      if (!wantCards.length && !haveCards.length) lockedRarity = null;
      updateTradeUI();
      fetchCards();
    }

    function updateTradeUI() {
      rarityBadge.innerHTML = lockedRarity ? `<span class="text-[10px] bg-yellow-500/20 text-yellow-400 px-2 py-0.5 rounded border border-yellow-500/30">已锁定: ${lockedRarity}</span>` : '';

      wantList.innerHTML = wantCards.length ? wantCards.map(c => `
        <div class="flex justify-between items-center bg-slate-800 p-1.5 rounded-lg border border-slate-700">
          <div class="flex items-center gap-2">
            <img src="${c.image}" class="w-8 h-11 object-cover rounded bg-slate-950" />
            <div>
              <p class="text-xs font-bold text-white">${c.name}</p>
              <p class="text-[10px] font-mono text-yellow-400">#${c.id}</p>
            </div>
          </div>
          <button onclick="removeItem('want', '${c.id}')" class="text-red-400 text-xs px-2">✕</button>
        </div>
      `).join('') : '<p class="text-slate-500 text-xs text-center py-4">点击 "+ 想要"</p>';

      haveList.innerHTML = haveCards.length ? haveCards.map(c => `
        <div class="flex justify-between items-center bg-slate-800 p-1.5 rounded-lg border border-slate-700">
          <div class="flex items-center gap-2">
            <img src="${c.image}" class="w-8 h-11 object-cover rounded bg-slate-950" />
            <div>
              <p class="text-xs font-bold text-white">${c.name}</p>
              <p class="text-[10px] font-mono text-green-400">#${c.id}</p>
            </div>
          </div>
          <button onclick="removeItem('have', '${c.id}')" class="text-red-400 text-xs px-2">✕</button>
        </div>
      `).join('') : '<p class="text-slate-500 text-xs text-center py-4">选择重复卡</p>';
    }

    function exportTradePost() {
      if (!haveCards.length && !wantCards.length) return alert('请先添加卡牌！');
      let text = `[Pokémon TCG Pocket Trade]\n\n🟡 WANT:\n` + 
        (wantCards.map(c => `- ${c.name} [#${c.id}] (${c.rarity})`).join('\n') || '- None') + 
        `\n\n🟢 HAVE:\n` + 
        (haveCards.map(c => `- ${c.name} [#${c.id}] (${c.rarity})`).join('\n') || '- None');
      navigator.clipboard.writeText(text);
      alert('贴文已复制！带准确编号');
    }

    // 输入搜索防抖 300ms
    searchInput.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(fetchCards, 300);
    });

    fetchCards();
  </script>
</body>
</html>
